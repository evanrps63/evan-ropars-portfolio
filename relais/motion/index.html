<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Relais by AXA — Motion</title>
<style>
  :root {
    --axa: #00008F;
    --red: #FF1721;
    --ink: #0B0B3B;
    --paper: #F3F4FA;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--paper); }
  body { font-family: "Inter", system-ui, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
  #stage { position: absolute; inset: 0; overflow: hidden; background: var(--paper); }
  .abs { position: absolute; will-change: transform, opacity; }

  /* light background decor */
  #grid { inset: 0; background-image: radial-gradient(rgba(0,0,143,.10) 1.6px, transparent 1.6px); background-size: 36px 36px; }
  #blob { width: 1100px; height: 1100px; border-radius: 50%; background: radial-gradient(circle, rgba(0,0,143,.10), rgba(0,0,143,0) 65%); left: 0; top: 0; }
  #bignum { font-weight: 900; font-size: 560px; line-height: 1; color: rgba(0,0,143,.045); letter-spacing: -30px; top: 230px; }

  /* blue layer */
  #blue { inset: 0; background: var(--axa); z-index: 10; }
  #blue .sky { position: absolute; left: 0; right: 0; bottom: 0; height: 330px; opacity: .55; }
  #slash { z-index: 11; width: 260px; height: 2400px; background: var(--red); left: 0; top: -660px; }

  .word { font-weight: 800; color: #fff; font-size: 140px; letter-spacing: -4px; white-space: nowrap; }
  .mask { overflow: hidden; position: absolute; left: 0; right: 0; text-align: center; }
  .mask > div { display: inline-block; }
  .tagline { font-weight: 800; color: #fff; font-size: 110px; letter-spacing: -3px; line-height: 1.05; }

  /* logo */
  .logo { color: #fff; }
  .logo .name { font-weight: 800; font-size: 200px; letter-spacing: -7px; line-height: 1; display: inline-block; vertical-align: top; }
  .logo .bar { display: inline-block; width: 44px; height: 168px; background: var(--red); transform: skewX(-18deg); margin-left: 34px; margin-top: 22px; vertical-align: top; transform-origin: bottom; }
  .logo .by { font-weight: 800; font-size: 64px; letter-spacing: -1px; margin-top: 4px; }

  /* phone */
  .phone { width: 408px; height: 852px; border-radius: 64px; background: #0E0E1A; padding: 14px;
           box-shadow: 0 60px 120px -30px rgba(0,0,80,.45), 0 30px 60px -30px rgba(0,0,0,.35), inset 0 0 0 2px #2A2A3A; }
  .phone .scr { position: relative; width: 380px; height: 824px; border-radius: 50px; overflow: hidden; background: #fff; }
  .phone .scr img { position: absolute; left: 0; top: 0; width: 380px; height: 824px; }
  .phone .island { position: absolute; left: 50%; top: 24px; width: 112px; height: 32px; margin-left: -56px; background: #0E0E1A; border-radius: 20px; z-index: 5; }
  .tap { width: 64px; height: 64px; margin: -32px 0 0 -32px; border-radius: 50%; background: rgba(255,23,33,.28); border: 3px solid rgba(255,23,33,.9); z-index: 6; }

  /* feature copy: number + key notion only */
  .copy { width: 820px; top: 400px; }
  .copy .num { font-size: 30px; font-weight: 800; color: var(--red); letter-spacing: 1px; display: flex; align-items: center; gap: 18px; }
  .copy .num b { display: inline-block; width: 16px; height: 42px; background: var(--red); transform: skewX(-18deg); }
  .copy h2 { font-size: 104px; line-height: 1.02; font-weight: 800; letter-spacing: -4px; color: var(--axa); margin-top: 26px; }
  .copy .line { display: block; white-space: nowrap; }

  /* progress dots */
  #dots { left: 50%; bottom: 52px; transform: translateX(-50%); display: flex; gap: 12px; }
  #dots i { display: block; height: 8px; width: 8px; border-radius: 4px; background: rgba(0,0,143,.18); }

  /* outro */
  .outro-copy { color: #fff; }
  .outro-copy .tag { font-size: 72px; font-weight: 800; letter-spacing: -2px; line-height: 1.1; }
</style>
</head>
<body>
<div id="stage">
  <div id="grid" class="abs"></div>
  <div id="blob" class="abs"></div>
  <div id="bignum" class="abs">01</div>

  <div class="copy abs" id="c1">
    <div class="num"><b></b>01</div>
    <h2><span class="line">Avance</span><span class="line">étape par étape.</span></h2>
  </div>
  <div class="copy abs" id="c2">
    <div class="num"><b></b>02</div>
    <h2><span class="line">Ton bouclier</span><span class="line">cyber.</span></h2>
  </div>
  <div class="copy abs" id="c3">
    <div class="num"><b></b>03</div>
    <h2><span class="line">Un pépin ?</span><span class="line">On gère.</span></h2>
  </div>
  <div class="copy abs" id="c4">
    <div class="num"><b></b>04</div>
    <h2><span class="line">Tes parents</span><span class="line">en relais.</span></h2>
  </div>

  <!-- outro side phones -->
  <div class="phone abs" id="phoneL"><div class="scr"><img src="screens/s05.png"></div><div class="island"></div></div>
  <div class="phone abs" id="phoneR"><div class="scr"><img src="screens/s15.png"></div><div class="island"></div></div>

  <!-- main phone -->
  <div class="phone abs" id="phone">
    <div class="scr" id="scr">
      <img id="s02" src="screens/s02.png"><img id="s04" src="screens/s04.png"><img id="s06" src="screens/s06.png">
      <img id="s09" src="screens/s09.png"><img id="s10" src="screens/s10.png">
      <img id="s11" src="screens/s11.png"><img id="s12" src="screens/s12.png">
      <img id="s13" src="screens/s13.png">
      <div class="tap abs" id="tap"></div>
    </div>
    <div class="island"></div>
  </div>

  <div id="dots" class="abs"><i></i><i></i><i></i><i></i></div>

  <!-- blue layer: intro + outro -->
  <div id="blue" class="abs">
    <svg class="sky" viewBox="0 0 1920 330" preserveAspectRatio="none">
      <path fill="#2B2BC9" d="M0 330V210h70v-60h50v60h40V120h60v90h50v-40h70v160h40V90h20V40h10v50h20v100h60v-70h80v210h50V150h90v180h40V200h70v130h60V60h30v-30h10v30h30v300h50V170h80v160h60V110h90v220h40V190h60v140h70V140h40v-30h10v30h40v190h60V200h90v130h60V160h70v170z"/>
    </svg>
    <div class="mask abs" id="w1" style="top:400px"><div class="word">Premier appart.</div></div>
    <div class="mask abs" id="w2" style="top:400px"><div class="word">Premier job.</div></div>
    <div class="mask abs" id="w3" style="top:400px"><div class="word">Permis.</div></div>
    <div class="mask abs" id="t1" style="top:355px"><div class="tagline">Ta vie change,</div></div>
    <div class="mask abs" id="t2" style="top:480px"><div class="tagline">ta protection aussi.</div></div>
    <div class="abs logo" id="logo" style="left:0;top:0">
      <div><span class="name">Relais</span><span class="bar" id="logobar"></span></div>
      <div class="by">by AXA</div>
    </div>
    <div class="abs outro-copy" id="outro" style="left:170px;top:520px">
      <div class="tag">À toi de jouer.<br>On reste là.</div>
    </div>
  </div>
  <div id="slash" class="abs"></div>
</div>

<script>
const $ = id => document.getElementById(id);
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, p) => a + (b - a) * p;
const eOut = p => 1 - Math.pow(1 - p, 3);
const eIn = p => p * p * p;
const eIO = p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
const eBack = p => { const c = 1.4, c3 = c + 1; return 1 + c3 * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); };
const set = (el, tf, op) => { el.style.transform = tf; if (op !== undefined) el.style.opacity = op; };

const DURATION = 30;
const PX = 380 / 285; // screen-sheet px -> phone px

// ---------- timing ----------
const WORD = 0.95;                 // each life-moment word
const TAG_IN = 3.15, TAG_OUT = 5.3; // "Ta vie change, ta protection aussi."
const LOGO_IN = 5.45;              // logo build
const WIPE = 7.1;                  // blue wipes out to the app scenes
const S = 1.2;                     // scene start offset after wipe
// [start, end, phone side, copy id]
const scenes = [
  [7.4, 12.6, 'R', 'c1'],
  [12.6, 17.2, 'L', 'c2'],
  [17.2, 21.8, 'R', 'c3'],
  [21.8, 25.9, 'L', 'c4'],
];
const OUTRO = 25.9;

// ---------- phone screen timeline ----------
// [time the slide starts, screen id, tap {x,y} in sheet px or null]
const flow = [
  [0,     's02', null],
  [9.3,   's04', [142, 192]],
  [11.0,  's06', [144, 155]],
  [12.7,  's09', null],
  [14.9,  's10', [144, 305]],
  [17.3,  's11', null],
  [19.5,  's12', [208, 184]],
  [21.9,  's13', null],
];
const SLIDE = 0.7, TAP = 0.6;
const allScreens = flow.map(f => f[1]);

function renderScreens(t) {
  let cur = 0;
  for (let i = 0; i < flow.length; i++) if (t >= flow[i][0]) cur = i;
  allScreens.forEach((id, i) => {
    const el = $(id);
    if (i === cur) {
      const p = i === 0 ? 1 : eIO(seg(t, flow[i][0], flow[i][0] + SLIDE));
      set(el, `translateX(${(1 - p) * 380}px)`, 1);
      el.style.zIndex = 2;
    } else if (i === cur - 1) {
      const p = eIO(seg(t, flow[cur][0], flow[cur][0] + SLIDE));
      set(el, `translateX(${-p * 120}px)`, 1 - p * 0.5);
      el.style.zIndex = 1;
    } else { el.style.opacity = 0; el.style.zIndex = 0; }
  });
  const tap = $('tap'); tap.style.opacity = 0;
  for (const [time, , pos] of flow) {
    if (!pos) continue;
    const p = seg(t, time - TAP, time + 0.15);
    if (p > 0 && p < 1) {
      tap.style.left = pos[0] * PX + 'px'; tap.style.top = pos[1] * PX + 'px';
      const s = p < .4 ? lerp(1.4, .8, eOut(p / .4)) : lerp(.8, 1.6, (p - .4) / .6);
      set(tap, `scale(${s})`, p < .4 ? eOut(p / .4) : 1 - (p - .4) / .6);
    }
  }
}

// ---------- feature scenes ----------
const RIGHT = 1350, LEFT = 570, CY = 540, MOVE = 1.0;

function phoneX(t) {
  let x = scenes[0][2] === 'R' ? RIGHT : LEFT;
  for (let i = 1; i < scenes.length; i++) {
    const b = scenes[i][0];
    const from = scenes[i - 1][2] === 'R' ? RIGHT : LEFT;
    const to = scenes[i][2] === 'R' ? RIGHT : LEFT;
    if (t >= b - MOVE / 2) x = lerp(from, to, eIO(seg(t, b - MOVE / 2, b + MOVE / 2)));
  }
  return x;
}

function renderCopy(t) {
  scenes.forEach(([a, b, side, id], i) => {
    const el = $(id);
    el.style.left = (side === 'R' ? 200 : 1010) + 'px';
    const last = i === scenes.length - 1;
    const outP = last ? 0 : eIn(seg(t, b - 0.55, b - 0.05));
    el.querySelectorAll('.num, .line').forEach((ln, j) => {
      const p = eOut(seg(t, a + 0.35 + j * 0.12, a + 1.15 + j * 0.12));
      set(ln, `translateY(${(1 - p) * 60}px)`, p * (1 - outP));
    });
    el.style.transform = `translateX(${(side === 'R' ? -1 : 1) * outP * 60}px)`;
    el.style.opacity = (t > a - 0.1 && t < b + 0.1) || (last && t < OUTRO + 0.8) ? 1 : 0;
  });
  let idx = 0; scenes.forEach((s, i) => { if (t >= s[0]) idx = i; });
  const s = scenes[idx];
  const p = eOut(seg(t, s[0], s[0] + 1.2));
  const bn = $('bignum');
  bn.textContent = '0' + (idx + 1);
  bn.style.left = (s[2] === 'R' ? 1000 : 120) + 'px';
  set(bn, `translateY(${(1 - p) * 80}px)`, t > WIPE && t < OUTRO + 0.6 ? p : 0);
  [...$('dots').children].forEach((d, i) => {
    const on = i === idx;
    d.style.width = on ? '44px' : '8px';
    d.style.background = on ? 'var(--axa)' : 'rgba(0,0,143,.18)';
  });
}

// ---------- master render ----------
function render(t) {
  // ===== INTRO (blue) =====
  ['w1', 'w2', 'w3'].forEach((id, i) => {
    const a = 0.3 + i * WORD, inner = $(id).firstElementChild;
    const pin = eOut(seg(t, a, a + 0.4));
    const pout = eIn(seg(t, a + WORD - 0.25, a + WORD));
    set(inner, `translateY(${(1 - pin) * 170 - pout * 170}px)`, 1);
    $(id).style.height = '180px';
    $(id).style.opacity = t >= a && t < a + WORD ? 1 : 0;
  });
  ['t1', 't2'].forEach((id, i) => {
    const a = TAG_IN + i * 0.25, inner = $(id).firstElementChild;
    const p = eOut(seg(t, a, a + 0.6));
    const out = eIn(seg(t, TAG_OUT - 0.3, TAG_OUT));
    set(inner, `translateY(${(1 - p) * 135 - out * 135}px)`, 1);
    $(id).style.height = '130px';
    $(id).style.opacity = t > a && t < TAG_OUT ? 1 : 0;
  });

  const logo = $('logo');
  const inIntro = t < WIPE + 0.5;
  const lp = eOut(seg(t, LOGO_IN, LOGO_IN + 0.6));
  const lo = eOut(seg(t, OUTRO + 1.0, OUTRO + 1.7));
  if (inIntro) {
    logo.style.left = '0px'; logo.style.right = '0px'; logo.style.top = '390px'; logo.style.textAlign = 'center';
    logo.style.transformOrigin = 'center';
    set(logo, `translateY(${(1 - lp) * 60}px) scale(${lerp(.92, 1, lp)})`, lp);
  } else {
    logo.style.left = '170px'; logo.style.right = 'auto'; logo.style.top = '220px'; logo.style.textAlign = 'left';
    logo.style.transformOrigin = 'left top';
    set(logo, `translateY(${(1 - lo) * 50}px) scale(.9)`, lo);
  }
  const bp = inIntro ? eBack(seg(t, LOGO_IN + 0.25, LOGO_IN + 0.75)) : eBack(seg(t, OUTRO + 1.3, OUTRO + 1.8));
  $('logobar').style.transform = `skewX(-18deg) scaleY(${bp})`;

  // blue layer wipes
  const blue = $('blue'), slash = $('slash');
  const wipeOut = eIO(seg(t, WIPE, WIPE + 0.8));
  const wipeIn = eIO(seg(t, OUTRO - 0.1, OUTRO + 0.8));
  if (t < WIPE + 1) {
    blue.style.clipPath = `polygon(${wipeOut * 2600 - 400}px 0, 1920px 0, 1920px 1080px, ${wipeOut * 2600 - 750}px 1080px)`;
    slash.style.opacity = wipeOut > 0 && wipeOut < 1 ? 1 : 0;
    set(slash, `translateX(${wipeOut * 2600 - 560}px) skewX(-18deg)`);
  } else if (t >= OUTRO - 0.1) {
    const x = 2350 - wipeIn * 2700;
    blue.style.clipPath = `polygon(${x + 350}px 0, 1920px 0, 1920px 1080px, ${x}px 1080px)`;
    slash.style.opacity = wipeIn > 0 && wipeIn < 1 ? 1 : 0;
    set(slash, `translateX(${x - 30}px) skewX(-18deg)`);
  } else {
    blue.style.clipPath = 'polygon(2000px 0, 2000px 0, 2000px 1080px, 2000px 1080px)';
    slash.style.opacity = 0;
  }
  blue.querySelector('.sky').style.opacity = t < WIPE + 1 ? .55 : .35;
  const op = eOut(seg(t, OUTRO + 1.6, OUTRO + 2.3));
  set($('outro'), `translateY(${(1 - op) * 40}px)`, t > OUTRO ? op : 0);

  // ===== PHONE =====
  const fly = eOut(seg(t, WIPE + 0.1, WIPE + 1.2));
  let px = phoneX(t), py = CY + (1 - fly) * 900;
  const rot = (1 - fly) * 12;
  const o = eIO(seg(t, OUTRO + 0.2, OUTRO + 1.2));
  const OX = 1330;
  px = lerp(px, OX, o);
  const ph = $('phone');
  ph.style.left = (px - 204) + 'px'; ph.style.top = (py - 426) + 'px';
  let tf = `rotate(${rot}deg) scale(${lerp(1, .9, o)})`;
  if (t > OUTRO + 2) tf += ` translateY(${Math.sin((t - OUTRO - 2) * 1.4) * 8}px)`;
  set(ph, tf, 1);
  ph.style.zIndex = t > OUTRO + 0.1 ? 30 : 3;
  if (t > OUTRO + 0.5) {
    allScreens.forEach(id => { const on = id === 's04'; $(id).style.opacity = on ? 1 : 0; $(id).style.transform = 'none'; $(id).style.zIndex = on ? 3 : 0; });
    $('tap').style.opacity = 0;
  } else renderScreens(t);
  const sp = eOut(seg(t, OUTRO + 0.9, OUTRO + 1.9));
  [['phoneL', -1], ['phoneR', 1]].forEach(([id, s]) => {
    const el = $(id);
    el.style.left = (OX - 204) + 'px'; el.style.top = (CY - 426) + 'px';
    el.style.zIndex = 29;
    set(el, `translateX(${s * sp * 300}px) translateY(${sp * 40}px) rotate(${s * sp * 9}deg) scale(.8)`, t > OUTRO + 0.7 ? clamp(sp * 2) : 0);
  });

  renderCopy(t);
  const featVis = t > WIPE && t < OUTRO + 0.8;
  scenes.forEach(s => { if (!featVis) $(s[3]).style.opacity = 0; });
  $('dots').style.opacity = clamp(seg(t, WIPE + 0.6, WIPE + 1.1)) * (1 - seg(t, OUTRO - 0.3, OUTRO));
  const bl = $('blob');
  bl.style.left = (px - 550) + 'px'; bl.style.top = (CY - 550) + 'px';
}

window.render = render;
window.DURATION = DURATION;
const q = new URLSearchParams(location.search);
if (q.has('t')) render(parseFloat(q.get('t')));
else {
  const t0 = performance.now();
  const loop = () => { render(((performance.now() - t0) / 1000) % DURATION); requestAnimationFrame(loop); };
  loop();
}
</script>
</body>
</html>
